<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labo — HAPAX</title>
<link rel="icon" href="favicon-labo.svg" type="image/svg+xml">
<link rel="stylesheet" href="js/lib/labo-shell.css?v=0.1.0">
<link rel="stylesheet" href="css/style.css?v=0.1.0">
<style>
  /* Le labo montre les éléments du jeu sur la nuit du jeu */
  .scene { background: var(--jeu-fond); color: var(--jeu-encre); font-family: var(--jeu-police); padding: 16px; border-radius: 6px; display: grid; gap: 12px; }
  .scene .rangee { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .scene .rangee .fragment { width: 72px; }
  .scene .rangee .joker { width: 150px; }
  .scene figure { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 13px; }
  .scene .table { height: auto; padding: 0; }
  .nuancier { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .nuancier div { padding: 12px; border-radius: 6px; font: 13px ui-monospace, monospace; }
  .labo-stage button.essai { min-height: 44px; padding: 0 14px; margin: 0 6px 6px 0; border: 1px solid rgba(0,0,0,.2); border-radius: 6px; background: #fff; font: inherit; }
  table.contraste { border-collapse: collapse; font: 13px ui-monospace, monospace; }
  table.contraste td, table.contraste th { border: 1px solid rgba(0,0,0,.12); padding: 6px 8px; text-align: center; }
</style>
</head>
<body>
<div id="labo"></div>
<script type="module" src="js/labo.js?v=0.1.0"></script>
</body>
</html>
